<!DOCTYPE html>
<html>
  <head>
    <title>Consejero de Vestimenta</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>

  <body>
    <h1> 🎀 Consejero de Vestimenta ☁️</h1>

    <form method="POST">
      <label>Temperatura actual (°C):</label>
      <input type="number" name="temperatura" required />

      <br /><br />

      <label>¿Está lloviendo?</label>

      <select name="llueve">
        <option value="s">Sí</option>
        <option value="n">No</option>
      </select>

      <br /><br />

      <button type="submit">Obtener consejo</button>
    </form>

    {% if consejo %}

    <hr />

    <h2>Resultado</h2>

    <p>{{ consejo }}</p>

    <h3>Prendas recomendadas:</h3>

    <ul>
      {% for prenda in prendas %}
      <li>{{ prenda }}</li>
      {% endfor %}
    </ul>

    {% endif %}
  </body>
</html>
